# USB_DISPLAY 专用 evdi 输出：关闭 modesetting 的 glamor 加速。
# evdi 不支持 Xorg 的加速 page flip，启用输出时必须使用 AccelMethod none，
# 否则会出现 flip_done timed out、Xorg 与桌面阻塞。
Section "OutputClass"
    Identifier "usbdisplay-evdi"
    MatchDriver "evdi"
    Driver "modesetting"
    Option "AccelMethod" "none"
    # evdi 的 vblank 需要用户态 grab 才完成；关闭 DRI3 page flip 后
    # 即使抓帧延迟，Xorg 也不会等待 evdi 的 flip_done，避免主屏被拖住。
    Option "PageFlip" "off"
EndSection
